<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中...</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}
.container { padding: 40px; }
h1 { font-size: 24px; margin-bottom: 20px; }
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.error { display: none; }
.error.show { display: block; }
a { color: white; text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="spinner" id="spinner"></div>
  <h1 id="message">正在跳转...</h1>
  <div class="error" id="error">
    <p>未找到对应的短链接</p>
    <p><a href="/">返回首页</a></p>
  </div>
</div>

<script>
// 获取短码
const path = window.location.pathname.substring(1);
const shortCode = path.split('/')[0];

if (!shortCode) {
  window.location.href = '/';
} else {
  // 先从localStorage查找
  const localLinks = JSON.parse(localStorage.getItem('pansou_links') || '{}');
  
  if (localLinks[shortCode]) {
    document.getElementById('message').textContent = '正在跳转到目标链接...';
    setTimeout(() => {
      window.location.href = localLinks[shortCode];
    }, 500);
  } else {
    // 从links.json查找（永久短链）
    fetch('/links.json')
      .then(res => res.json())
      .then(links => {
        if (links[shortCode]) {
          document.getElementById('message').textContent = '正在跳转到目标链接...';
          setTimeout(() => {
            window.location.href = links[shortCode];
          }, 500);
        } else {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('message').style.display = 'none';
          document.getElementById('error').classList.add('show');
        }
      })
      .catch(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('message').style.display = 'none';
        document.getElementById('error').classList.add('show');
      });
  }
}
</script>
</body>
</html>
