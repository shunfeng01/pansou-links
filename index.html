<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘搜短链 - 短链接生成工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 16px;
  padding: 40px;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 {
  text-align: center;
  color: #333;
  margin-bottom: 10px;
  font-size: 28px;
}
.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 30px;
  font-size: 14px;
}
.input-group {
  margin-bottom: 15px;
}
label {
  display: block;
  margin-bottom: 6px;
  color: #555;
  font-weight: 500;
  font-size: 14px;
}
input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.3s;
}
input:focus {
  outline: none;
  border-color: #667eea;
}
button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  margin-top: 10px;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}
.result {
  margin-top: 20px;
  padding: 15px;
  background: #f0f4ff;
  border-radius: 8px;
  display: none;
}
.result.show { display: block; }
.result-label {
  font-size: 12px;
  color: #888;
  margin-bottom: 5px;
}
.result-url {
  font-size: 16px;
  color: #667eea;
  font-weight: 600;
  word-break: break-all;
  cursor: pointer;
}
.result-url:hover { text-decoration: underline; }
.hint {
  margin-top: 20px;
  padding: 12px;
  background: #fff8e1;
  border-radius: 8px;
  font-size: 13px;
  color: #8d6e00;
  line-height: 1.6;
}
.admin-section {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #eee;
}
.admin-toggle {
  background: none;
  color: #999;
  font-size: 12px;
  padding: 5px;
  width: auto;
  box-shadow: none;
}
.admin-toggle:hover {
  background: none;
  transform: none;
  box-shadow: none;
  color: #667eea;
}
.admin-panel {
  display: none;
  margin-top: 15px;
}
.admin-panel.show { display: block; }
.link-list {
  margin-top: 15px;
  max-height: 300px;
  overflow-y: auto;
}
.link-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}
.link-item .short { color: #667eea; font-weight: 600; }
.link-item .long { color: #888; flex: 1; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.delete-btn {
  background: #ff4757;
  padding: 4px 10px;
  font-size: 12px;
  width: auto;
  margin: 0;
}
</style>
</head>
<body>
<div class="container">
  <h1>🔗 盘搜短链</h1>
  <p class="subtitle">把长链接变短，分享更方便</p>
  
  <div class="input-group">
    <label>长链接</label>
    <input type="text" id="longUrl" placeholder="粘贴要缩短的长链接，比如夸克网盘链接">
  </div>
  <div class="input-group">
    <label>自定义短码（可选）</label>
    <input type="text" id="shortCode" placeholder="留空自动生成，比如 movie01">
  </div>
  <button onclick="generateShortLink()">生成短链接</button>
  
  <div class="result" id="result">
    <div class="result-label">你的短链接（点击复制）：</div>
    <div class="result-url" id="resultUrl" onclick="copyResult()"></div>
  </div>
  
  <div class="hint">
    💡 提示：短链接数据保存在浏览器本地，清理浏览器数据会丢失。<br>
    建议重要短链同时记录到GitHub的links.json文件中，确保永久有效。
  </div>
  
  <div class="admin-section">
    <button class="admin-toggle" onclick="toggleAdmin()">⚙️ 管理已生成的短链</button>
    <div class="admin-panel" id="adminPanel">
      <div class="link-list" id="linkList"></div>
    </div>
  </div>
</div>

<script>
const BASE_URL = window.location.origin + '/';

function getLinks() {
  return JSON.parse(localStorage.getItem('pansou_links') || '{}');
}

function saveLinks(links) {
  localStorage.setItem('pansou_links', JSON.stringify(links));
}

function generateCode() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function generateShortLink() {
  const longUrl = document.getElementById('longUrl').value.trim();
  let shortCode = document.getElementById('shortCode').value.trim();
  
  if (!longUrl) {
    alert('请输入长链接');
    return;
  }
  
  if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
    alert('请输入以 http:// 或 https:// 开头的链接');
    return;
  }
  
  const links = getLinks();
  
  if (!shortCode) {
    do {
      shortCode = generateCode();
    } while (links[shortCode]);
  } else {
    if (links[shortCode]) {
      alert('这个短码已经被使用了，请换一个');
      return;
    }
  }
  
  links[shortCode] = longUrl;
  saveLinks(links);
  
  const shortUrl = BASE_URL + shortCode;
  document.getElementById('resultUrl').textContent = shortUrl;
  document.getElementById('result').classList.add('show');
  
  document.getElementById('longUrl').value = '';
  document.getElementById('shortCode').value = '';
  
  renderLinkList();
}

function copyResult() {
  const url = document.getElementById('resultUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    alert('已复制到剪贴板！');
  });
}

function toggleAdmin() {
  document.getElementById('adminPanel').classList.toggle('show');
  renderLinkList();
}

function renderLinkList() {
  const links = getLinks();
  const list = document.getElementById('linkList');
  const keys = Object.keys(links);
  
  if (keys.length === 0) {
    list.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">还没有短链接</p>';
    return;
  }
  
  list.innerHTML = keys.map(code => `
    <div class="link-item">
      <span class="short">${code}</span>
      <span class="long" title="${links[code]}">${links[code]}</span>
      <button class="delete-btn" onclick="deleteLink('${code}')">删除</button>
    </div>
  `).join('');
}

function deleteLink(code) {
  if (confirm('确定删除这个短链接吗？')) {
    const links = getLinks();
    delete links[code];
    saveLinks(links);
    renderLinkList();
  }
}
</script>
</body>
</html>
